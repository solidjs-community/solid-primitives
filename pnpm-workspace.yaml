packages:
  - packages/*
  - site

overrides:
  react: 19.2.7
  react-dom: 19.2.7
  # @kobalte/solidbase still depends on @solidjs/router ^0.15.3. Without this
  # override the site app and solidbase get separate router instances, which
  # breaks SSR. Remove once solidbase depends on router 1.
  '@solidjs/router': ^1.0.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: false

# @kobalte/solidbase imports "resolve" and "esbuild" without declaring them,
# which breaks pnpm installs. esbuild used to be satisfied by a hoisted copy
# from @solidjs/start's dependencies; start 2 no longer pulls it in.
# Remove once fixed upstream.
packageExtensions:
  '@kobalte/solidbase':
    dependencies:
      resolve: ^1.22.8
      esbuild: ^0.25.0

minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.0-rc.0'
  - '@solidjs/web@2.0.0-rc.0'
  - solid-js@2.0.0-rc.0
  - '@dom-expressions/babel-plugin-jsx@0.50.0-next.42'
  - babel-preset-solid@2.0.0-rc.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

catalog:
  tsdown: ^0.22.3
  unplugin-solid: ^1.0.0
  solid-js: 2.0.0-rc.0
  '@solidjs/web': 2.0.0-rc.0
  '@solidjs/signals': 2.0.0-rc.0
  babel-preset-solid: 2.0.0-rc.0
  '@babel/core': ^7.29.7

catalogs:
  peer:
    solid-js: ^2.0.0-rc.0
    '@solidjs/web': ^2.0.0-rc.0

patchedDependencies:
  storybook-solidjs-vite@10.5.2: patches/storybook-solidjs-vite@10.5.2.patch
