packages:
  - packages/*
  - site

overrides:
  react: 19.2.7
  react-dom: 19.2.7

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: false

minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.0-rc.21'
  - '@solidjs/web@2.0.0-rc.21'
  - solid-js@2.0.0-rc.21
  - '@dom-expressions/babel-plugin-jsx@0.50.0-next.44'
  - '@solidjs/vite-plugin@3.0.0-next.56'

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

catalog:
  tsdown: ^0.23.5
  unplugin-solid: ^3.0.0
  solid-js: 2.0.0-rc.21
  '@solidjs/web': 2.0.0-rc.21
  '@solidjs/signals': 2.0.0-rc.21
  '@solidjs/babel-plugin': 2.0.0-rc.21
  '@solidjs/vite-plugin': 3.0.0-next.56
  '@babel/core': ^7.29.7

catalogs:
  peer:
    solid-js: 2.0.0-rc.21
    '@solidjs/web': ^2.0.0-rc.21
